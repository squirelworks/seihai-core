name: Release

# Publishes "seihai-core vX.Y.Z" when main carries a workspace version that has
# no tag yet. It runs after CI passes on a push to main, so a release is only
# cut from a green commit. Bumping `version` in Cargo.toml is all a release
# takes. Notes come from release-notes/vX.Y.Z.md; without one, GitHub
# generates them from the merged PRs. If the release already exists and its
# notes file is present, the notes are updated to match the file. Run it by
# hand (workflow_dispatch) to publish or refresh main's current version.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Read the workspace version
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "No [workspace.package] version in Cargo.toml" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $version"

      - name: Publish the release, or refresh its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          notes="release-notes/$TAG.md"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
              echo "Updated the notes on seihai-core $TAG from $notes"
            else
              echo "$TAG already exists and has no notes file; nothing to do."
            fi
            exit 0
          fi
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "seihai-core $TAG" \
            "${notes_args[@]}"
          echo "Published seihai-core $TAG on $SHA"
