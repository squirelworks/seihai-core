name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Public IPv4 literals outside loopback / private / RFC 5737 (issue #81).
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No public IPv4 outside the allow-list
        run: python .github/scripts/check_public_ipv4.py
      - name: No lab names, home paths or binary addresses
        env:
          LAB_LEAK_DENYLIST: ${{ secrets.LAB_LEAK_DENYLIST }}
          LAB_LEAK_REQUIRE_DENYLIST: ${{ github.event.pull_request.head.repo.fork != true }}
        run: python .github/scripts/check_lab_leaks.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Linux builds without the `audio` feature, so the job needs no ALSA
      # development files. Windows builds the default, with audio.
      FEATURES: ${{ matrix.os == 'ubuntu-latest' && '--no-default-features --features dev' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      # Keep text fixtures (levels, ganis, scripts) byte-for-byte on Windows.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo build --workspace $FEATURES
      - run: cargo test --workspace --no-fail-fast $FEATURES
      - run: cargo fmt --all -- --check
        if: ${{ !cancelled() }}
      - run: cargo clippy --workspace --all-targets $FEATURES -- -D warnings
        if: ${{ !cancelled() }}
      # The docs build without warnings (roadmap Phase 2): Linux checks
      # them without `audio`, Windows with it.
      - run: cargo doc --no-deps --workspace $FEATURES
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
