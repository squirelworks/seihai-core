# Weekly smoke fuzz for #80. Nightly only; not part of the stable CI matrix.
name: Fuzz

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run each target briefly
        env:
          # Ubuntu's `c++` is often clang without libstdc++ headers for ASAN.
          CXX: g++
        run: |
          set -euo pipefail
          targets=(
            level gani gmap zlib_body list_reply player_props
            gs1_parse gs2_compile gs2_bytecode gen3_decode gen5_frame
          )
          for t in "${targets[@]}"; do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" -- -max_total_time=120 -max_len=65536
            echo "::endgroup::"
          done
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
