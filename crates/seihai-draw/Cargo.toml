[package]
name = "seihai-draw"
version.workspace = true
edition.workspace = true
license.workspace = true

# UI-less drawing shared with tools. Tiles and one gani frame go into an
# RGBA buffer. No window, no sound, and no second level or gani parser:
# those types come from seihai-core. The flat view Ato and Issho share
# (seihai's `seihai-play`) draws through it; seihai-mae keeps its own
# renderer for now.
[lib]
name = "seihai_draw"
path = "src/lib.rs"

[dependencies]
# The core of this same repo and tag, so a Level or Gani a tool parses is
# the type this crate paints. No core features: drawing needs none.
seihai-core = { path = "../seihai-core", default-features = false }
# Glyph outlines and coverage for `text` (TrueType / OpenType; the font
# is the caller's, none is bundled).
ab_glyph = "0.2"
